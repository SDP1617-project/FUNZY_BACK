name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check if this is the latest commit on develop
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api repos/${{ github.repository }}/git/refs/heads/develop --jq .object.sha)
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          if [ "$HEAD_SHA" = "$LATEST" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${HEAD_SHA}는 develop의 최신 커밋(${LATEST})이 아니라 배포를 건너뜁니다"
          fi

      - name: Checkout
        if: steps.check.outputs.is_latest == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up JDK 21
        if: steps.check.outputs.is_latest == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        if: steps.check.outputs.is_latest == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build jar
        if: steps.check.outputs.is_latest == 'true'
        run: chmod +x gradlew && ./gradlew bootJar -x test

      - name: Copy files to EC2
        if: steps.check.outputs.is_latest == 'true'
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "Dockerfile,docker-compose.yml,.dockerignore,build/libs/*.jar"
          target: "~/app"

      - name: Deploy on EC2
        if: steps.check.outputs.is_latest == 'true'
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/app
            docker compose up -d --build
            docker image prune -f
            for i in $(seq 1 30); do curl -sf --connect-timeout 3 --max-time 5 http://localhost:8080/health && break; sleep 2; done
            curl -sf --connect-timeout 3 --max-time 5 http://localhost:8080/health || { echo "배포 후 헬스체크 실패"; exit 1; }
