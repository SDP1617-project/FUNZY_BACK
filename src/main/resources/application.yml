spring:
  application:
    name: backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET:sdp1617-local-dev-jwt-secret-key-please-change-1234567890abcdef}
  access-expiration: 3600000
  refresh-expiration: 2592000000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    enabled: ${MAIL_ENABLED:false}
  support:
    terms-of-service-url: ${TERMS_OF_SERVICE_URL:https://sdp1617.example.com/terms}
    privacy-policy-url: ${PRIVACY_POLICY_URL:https://sdp1617.example.com/privacy}
  social:
    max-follow-count: ${MAX_FOLLOW_COUNT:50}

google:
  client-id: ${GOOGLE_CLIENT_ID:68223418406-g2sdcb7dj9kl8rnl2emp1eg8kfbp08el.apps.googleusercontent.com}
