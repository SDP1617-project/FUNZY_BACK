spring:
  application:
    name: backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:sdp1617-local-dev-jwt-secret-key-please-change-1234567890abcdef}
  access-expiration: 3600000
  refresh-expiration: 2592000000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    enabled: ${MAIL_ENABLED:false}
