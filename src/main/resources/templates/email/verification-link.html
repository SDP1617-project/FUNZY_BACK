<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${title}">Funzy</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f1ec; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f1ec; padding:32px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0"
             style="background-color:#ffffff; border-radius:14px; overflow:hidden; box-shadow:0 2px 10px rgba(43,36,32,0.08);">
        <tr>
          <td style="padding:44px 40px 8px;" align="center">
            <img th:src="${logoUrl}" width="72" alt="Funzy" style="display:block; width:72px; height:auto; margin:0 auto;">
          </td>
        </tr>
        <tr>
          <td style="padding:24px 40px 0;" align="center">
            <h1 style="margin:0 0 12px; font-size:19px; color:#2B2420; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;" th:text="${title}">제목</h1>
            <p style="margin:0 0 32px; font-size:14px; line-height:1.7; color:#6B6058; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;" th:text="${message}">안내 문구</p>
          </td>
        </tr>
        <tr>
          <td align="center">
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td style="border-radius:10px; background-color:#FF5100;">
                  <a th:href="${link}"
                     style="display:inline-block; padding:14px 36px; font-size:15px; font-weight:700; color:#ffffff; text-decoration:none; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;"
                     th:text="${buttonText}">바로가기</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 40px 0;" align="center">
            <p style="margin:0; font-size:12px; line-height:1.7; color:#A39A91; word-break:break-all; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;">
              버튼이 눌리지 않는다면 아래 링크를 복사해 브라우저 주소창에 붙여넣어주세요.<br>
              <a th:href="${link}" th:text="${link}" style="color:#FF5100;">링크</a>
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 40px 40px;" align="center">
            <div style="width:100%; height:1px; background-color:#F0ECE6; margin:0 0 20px;"></div>
            <p style="margin:0; font-size:12px; line-height:1.7; color:#C2B9AE; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;">
              이 링크는 <span th:text="${ttlMinutes}">15</span>분간 유효합니다.<br>
              본인이 요청하지 않았다면 이 메일을 무시하셔도 됩니다.
            </p>
            <p style="margin:16px 0 0; font-size:11px; color:#D6CEC4; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;">© 2026 Funzy</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
